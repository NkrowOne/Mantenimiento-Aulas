# Despliegue completo: Supabase self-hosted, Caddy, worker de informes y copias.
#
#   cp .env.example .env
#   npx tsx scripts/gen-keys.ts   # y pega el resultado en .env
#   ./scripts/deploy.sh
#
# Todo vive en una red interna. Lo único publicado es el 443 de Caddy, y aun
# así el nombre solo resuelve dentro de la red o de la VPN.

services:
  # ── Base de datos ────────────────────────────────────────────────────
  db:
    image: supabase/postgres:15.8.1.060
    container_name: aulas-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      TZ: Europe/Madrid
    command:
      - postgres
      - -c
      # `pg_net` TIENE que ir aquí, y que falte es invisible: la extensión se
      # crea sin quejarse, `net.http_post()` devuelve un id como si trabajara,
      # y la petición se queda en su cola para siempre porque el proceso de
      # fondo que la despacha solo arranca si la librería está precargada. Así
      # es exactamente como los informes estuvieron sin generarse — sin un solo
      # error en ningún registro. La imagen de Supabase lo trae en su
      # postgresql.conf, pero este `-c` PISA esa lista entera: lo que no esté
      # escrito aquí, no se carga.
      - shared_preload_libraries=pg_stat_statements,pg_cron,pg_net
      - -c
      - cron.database_name=postgres
      # `pg_cron` interpreta sus horarios en `cron.timezone`, que por defecto es
      # GMT: «diario a las 07:00» disparaba a las 09:00 de Madrid en verano y a
      # las 08:00 en invierno, cambiando solo dos veces al año. Va aquí y no en
      # una migración porque es un parámetro de arranque, no de sesión.
      - -c
      - cron.timezone=Europe/Madrid
      - -c
      - timezone=Europe/Madrid
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  # ── Autenticación ────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: aulas-auth
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN:?falta DOMAIN}
      GOTRUE_SITE_URL: https://${DOMAIN}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      # El alta la hace un administrador con `npm run admin:user`. Dejar el
      # registro abierto permitiría a cualquiera crearse una cuenta.
      GOTRUE_DISABLE_SIGNUP: 'true'

      # Sin SMTP: los informes son de descarga y las altas se entregan en mano,
      # así que no hay ningún correo que enviar.
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'

      # ── Endurecimiento por estar expuesto a Internet ──────────────────
      #
      # Detrás de una VPN el login solo lo alcanzaba el personal. En Internet
      # lo alcanza cualquiera, así que el endpoint de contraseña necesita
      # freno: es la puerta por la que se canjean los códigos de alta.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: '30'
      GOTRUE_RATE_LIMIT_VERIFY: '10'
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For

      # Rotación de refresh tokens con detección de reutilización. Si alguien
      # clona la sesión de un iPad, el token robado y el legítimo entran en
      # conflicto y GoTrue revoca la familia entera. Es la única defensa que
      # queda si el dispositivo se pierde desbloqueado.
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'

      # ⚠️ El hook que mete el rol en el JWT. En self-hosted se activa AQUÍ, no
      # desde ningún panel: la documentación oficial está escrita para la nube y
      # no lo menciona. Sin esto, `auth_role()` devuelve 'none', RLS no deja
      # hacer nada y el fallo no da ningún mensaje útil.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: 'true'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/custom_access_token_hook
    networks: [interna]

  # ── API REST sobre las tablas ────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: aulas-rest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
    networks: [interna]

  # ── Ficheros ─────────────────────────────────────────────────────────
  storage:
    image: supabase/storage-api:v1.19.3
    container_name: aulas-storage
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ANON_KEY: ${ANON_KEY:?falta ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?falta SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: aulas
      REGION: local
      GLOBAL_S3_BUCKET: aulas
    volumes:
      - storage-data:/var/lib/storage
    networks: [interna]

  # ── Puerta de entrada a la API ───────────────────────────────────────
  kong:
    image: kong:3.9
    container_name: aulas-kong
    restart: unless-stopped
    depends_on: [auth, rest, storage]
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro
    networks: [interna]

  # ── TLS y servicio de la PWA ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: aulas-caddy
    restart: unless-stopped
    depends_on: [kong]
    # La imagen base no trae el módulo de Cloudflare; se construye con él.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?falta CLOUDFLARE_API_TOKEN}
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/dist:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks: [interna]

  # ── Informes ─────────────────────────────────────────────────────────
  reports-worker:
    build: ./reports-worker
    container_name: aulas-reports
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SUPABASE_URL: https://${DOMAIN}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      WORKER_TOKEN: ${REPORTS_WORKER_TOKEN:?falta REPORTS_WORKER_TOKEN}
      # Sin clave el informe sale igual, con el análisis calculado: por eso no
      # lleva `:?` y no impide arrancar. Si falta, el worker lo dice en su
      # registro la primera vez que genera un informe.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_THINKING: ${GEMINI_THINKING:-}
      PORT: 8080
      # Los instantes se guardan en UTC; esto solo hace que los registros del
      # contenedor y la hora local de Node coincidan con la del equipo.
      TZ: Europe/Madrid
    # Sin puertos publicados: solo lo llama pg_cron desde dentro de la red.
    expose: ['8080']
    # Un weasyprint colgado no tumba el proceso, así que `restart: unless-stopped`
    # por sí solo no rescata: hace falta que algo pregunte si sigue respondiendo.
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:8080/salud',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [interna]

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
  caddy-logs:

networks:
  interna:
    driver: bridge

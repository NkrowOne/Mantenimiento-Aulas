_format_version: '2.1'
_transform: true

# Kong enruta la API de Supabase. Caddy ya termina el TLS y sirve la PWA, así
# que aquí solo se reparte el tráfico por prefijo de ruta.
#
# No hay plugin de CORS a propósito: la PWA y la API comparten origen
# («aulas.tudominio.es»), así que no hay peticiones entre orígenes. Añadirlo
# sería configurar una defensa contra algo que no ocurre, y una cosa más que
# puede quedar mal puesta.

# Este fichero es una PLANTILLA: el arranque del servicio kong la renderiza
# sustituyendo $SUPABASE_ANON_KEY y $SUPABASE_SERVICE_KEY desde el entorno.
# Kong no expande variables por su cuenta en configuración declarativa; sin el
# renderizado, las credenciales eran los literales y toda la API contestaba 401.
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

# Sin sección «acls»: no había ningún plugin acl que usara esos grupos —eran
# configuración muerta— y declararlos sin el plugin «acl» en KONG_PLUGINS hace
# que Kong 3.x RECHACE el fichero entero y no arranque. Si algún día una ruta
# necesita grupos, se añade el plugin a KONG_PLUGINS y se recupera la sección.

services:
  # GoTrue. Sin key-auth: el registro está deshabilitado y los endpoints de
  # administración exigen la clave de servicio en la cabecera Authorization,
  # que valida el propio GoTrue.
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: true
          key_names: [apikey]

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
          key_names: [apikey]

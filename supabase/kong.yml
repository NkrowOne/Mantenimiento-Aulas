_format_version: '2.1'
_transform: true

# Kong enruta la API de Supabase. Caddy ya termina el TLS y sirve la PWA, así
# que aquí solo se reparte el tráfico por prefijo de ruta.
#
# No hay plugin de CORS a propósito: la PWA y la API comparten origen
# (`aulas.tudominio.es`), así que no hay peticiones entre orígenes. Añadirlo
# sería configurar una defensa contra algo que no ocurre, y una cosa más que
# puede quedar mal puesta.

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # GoTrue. Sin key-auth: el registro está deshabilitado y los endpoints de
  # administración exigen la clave de servicio en la cabecera Authorization,
  # que valida el propio GoTrue.
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: true
          key_names: [apikey]

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
          key_names: [apikey]
